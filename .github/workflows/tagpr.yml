name: tagpr

on:
  push:
    branches:
      - main

jobs:
  tagpr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GH_PAT }}
      - uses: Songmu/tagpr@0c4eb5a3b0862693702acea436a7c68bd586530d # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
